name: Update stock list
on:
  schedule:
    - cron: "23 4 * * 2-6"   # after each US trading day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/universe.py
      - name: Save the list
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/universe.json
          git diff --cached --quiet || (git commit -m "Update US stock list" && git push)
