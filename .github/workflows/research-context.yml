name: Research context
on:
  push:
    branches: [main]
    paths: ["research/context_research.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt numba
      - run: python research/context_research.py
      - name: Save the results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add research/*.csv
          git diff --cached --quiet || (git commit -m "Context research results" && git pull --rebase -q && git push)
