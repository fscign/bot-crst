name: Scan markets
on:
  # The dashboard starts this job every 15 minutes (needs the GH_DISPATCH_TOKEN secret).
  # The hourly schedule below is only a backup in case that trigger is not set up.
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false   # a new scan waits for the running one; extra waiting scans are dropped
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and send to dashboard
        run: python scanner/scan.py
        env:
          DASH_URL: https://${{ secrets.DASH_DOMAIN || vars.DASH_DOMAIN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
