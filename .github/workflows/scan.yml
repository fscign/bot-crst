name: Scan markets
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and send to dashboard
        run: python scanner/scan.py
        env:
          DASH_URL: https://${{ secrets.DASH_DOMAIN || vars.DASH_DOMAIN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
