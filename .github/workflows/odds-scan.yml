name: Odds scan
on:
  # Every hour. The scanner itself decides how many credits each run may spend (see plan_scan in odds/engine.py),
  # so quiet hours cost nothing and the hours before kick-off get more.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: odds-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tests/test_odds.py
      - name: Scan odds, alert, update the dashboard
        run: python odds/scan.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_DOMAIN: ${{ secrets.ODDS_DOMAIN || vars.ODDS_DOMAIN }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
